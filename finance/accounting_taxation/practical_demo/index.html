<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Practical Simulator | Pixelbotix Eduverse</title>
  
  <style>
    /* Reset margins and eliminate external page scrollbars */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* Container fills the entire viewport */
    .simulator-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      border: none;
    }

    /* Seamless full-screen iframe */
    .simulator-container iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }
  </style>
</head>
<body>

  <div class="simulator-container">
    <iframe 
      src="https://inpatpro.com/practical_demo" 
      title="Practical Simulation Lab"
      allow="clipboard-read; clipboard-write"
      allowfullscreen>
    </iframe>
  </div>

</body>
</html>
