<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Practical Simulator | PixelBotix Eduverse</title>

  <style>
    /* =========================================================
       THEME VARIABLES
    ========================================================= */

    :root {
      --bg: #ffffff;
      --bg-secondary: #f8fafc;
      --border: #e2e8f0;

      --text: #0f172a;
      --muted: #64748b;

      --primary: #0284c7;
      --primary-hover: #0369a1;

      --header-bg: rgba(255, 255, 255, 0.94);
      --footer-bg: #f8fafc;

      color-scheme: light;
    }

    html.dark {
      --bg: #0f172a;
      --bg-secondary: #111827;
      --border: #334155;

      --text: #f8fafc;
      --muted: #94a3b8;

      --primary: #38bdf8;
      --primary-hover: #0284c7;

      --header-bg: rgba(15, 23, 42, 0.94);
      --footer-bg: #0b1220;

      color-scheme: dark;
    }


    /* =========================================================
       GLOBAL RESET
    ========================================================= */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
    }

    html {
      width: 100%;
      min-height: 100%;

      background: var(--bg);

      transition:
        background-color 0.25s ease;
    }

    body {
      width: 100%;
      min-height: 100vh;

      background: var(--bg);
      color: var(--text);

      display: flex;
      flex-direction: column;

      transition:
        background-color 0.25s ease,
        color 0.25s ease;
    }


    /* =========================================================
       HEADER
    ========================================================= */

    .navbar {
      width: 100%;
      height: 72px;

      flex-shrink: 0;

      background: var(--header-bg);
      border-bottom: 1px solid var(--border);

      display: flex;
      align-items: center;

      position: relative;
      z-index: 100;

      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);

      transition:
        background-color 0.25s ease,
        border-color 0.25s ease;
    }

    .nav-container {
      width: 100%;
      max-width: 1180px;

      margin: 0 auto;
      padding: 0 24px;

      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      display: flex;
      align-items: center;

      text-decoration: none;

      flex-shrink: 0;
    }

    .logo img {
      height: 48px;
      width: auto;

      display: block;
    }

    .nav-right {
      display: flex;
      align-items: center;

      gap: 26px;
    }

    .nav-link {
      color: var(--muted);

      text-decoration: none;

      font-size: 0.95rem;
      font-weight: 500;

      transition: color 0.2s ease;
    }

    .nav-link:hover {
      color: var(--text);
    }

    .nav-link.active {
      color: var(--primary);
    }


    /* =========================================================
       DARK / LIGHT MODE TOGGLE
    ========================================================= */

    .theme-toggle {
      width: 40px;
      height: 40px;

      border-radius: 10px;

      border: 1px solid var(--border);
      background: transparent;

      color: var(--text);

      display: flex;
      align-items: center;
      justify-content: center;

      cursor: pointer;

      transition:
        background-color 0.2s ease,
        border-color 0.2s ease,
        color 0.2s ease;
    }

    .theme-toggle:hover {
      background: var(--bg-secondary);
      border-color: var(--primary);
      color: var(--primary);
    }

    .theme-toggle svg {
      width: 19px;
      height: 19px;
    }

    .sun-icon {
      display: none;
    }

    html.dark .sun-icon {
      display: block;
    }

    html.dark .moon-icon {
      display: none;
    }


    /* =========================================================
       SIMULATOR AREA
    ========================================================= */

    .simulator-container {
      width: 100%;

      flex: 1;

      min-height:
        calc(100vh - 72px - 150px);

      background: var(--bg);

      transition:
        background-color 0.25s ease;
    }

    .simulator-container iframe {
      width: 100%;
      height: 100%;

      min-height:
        calc(100vh - 72px - 150px);

      border: 0;

      display: block;
    }


    /* =========================================================
       FOOTER
    ========================================================= */

    .footer {
      width: 100%;

      flex-shrink: 0;

      background: var(--footer-bg);
      border-top: 1px solid var(--border);

      transition:
        background-color 0.25s ease,
        border-color 0.25s ease;
    }

    .footer-container {
      max-width: 1180px;

      margin: 0 auto;

      padding: 30px 24px 18px;
    }

    .footer-main {
      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 30px;
    }

    .footer-brand {
      display: flex;
      flex-direction: column;

      gap: 8px;
    }

    .footer-logo {
      height: 40px;
      width: auto;

      display: block;
    }

    .footer-description {
      color: var(--muted);

      font-size: 0.82rem;
      line-height: 1.5;
    }

    .footer-links {
      display: flex;
      align-items: center;

      gap: 24px;
    }

    .footer-link {
      color: var(--muted);

      text-decoration: none;

      font-size: 0.86rem;

      transition: color 0.2s ease;
    }

    .footer-link:hover {
      color: var(--primary);
    }

    .footer-bottom {
      margin-top: 22px;
      padding-top: 15px;

      border-top: 1px solid var(--border);

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 20px;
    }

    .copyright,
    .eduverse-label {
      color: var(--muted);

      font-size: 0.76rem;
    }


    /* =========================================================
       TABLET
    ========================================================= */

    @media (max-width: 800px) {

      .navbar {
        height: 66px;
      }

      .nav-container {
        padding: 0 18px;
      }

      .logo img {
        height: 44px;
      }

      .nav-right {
        gap: 17px;
      }

      .simulator-container {
        min-height:
          calc(100vh - 66px - 180px);
      }

      .simulator-container iframe {
        min-height:
          calc(100vh - 66px - 180px);
      }

      .footer-main {
        align-items: flex-start;

        flex-direction: column;

        gap: 20px;
      }
    }


    /* =========================================================
       MOBILE
    ========================================================= */

    @media (max-width: 520px) {

      .navbar {
        height: 62px;
      }

      .nav-container {
        padding: 0 16px;
      }

      .logo img {
        height: 40px;
      }

      .nav-right {
        gap: 12px;
      }

      .nav-link {
        font-size: 0.82rem;
      }

      .theme-toggle {
        width: 36px;
        height: 36px;

        border-radius: 9px;
      }

      .theme-toggle svg {
        width: 17px;
        height: 17px;
      }

      .simulator-container {
        min-height:
          calc(100vh - 62px - 195px);
      }

      .simulator-container iframe {
        min-height:
          calc(100vh - 62px - 195px);
      }

      .footer-container {
        padding: 26px 18px 17px;
      }

      .footer-logo {
        height: 37px;
      }

      .footer-description {
        font-size: 0.78rem;
      }

      .footer-links {
        gap: 18px;
      }

      .footer-link {
        font-size: 0.8rem;
      }

      .footer-bottom {
        margin-top: 20px;
        padding-top: 14px;

        flex-direction: column;
        align-items: flex-start;

        gap: 6px;
      }
    }
  </style>
</head>


<body>

  <!-- ========================================================
       PIXELBOTIX EDUVERSE HEADER
  ========================================================= -->

  <header class="navbar">

    <div class="nav-container">

      <!-- PixelBotix Logo -->

      <a
        href="https://pixelbotix.com/"
        class="logo"
        aria-label="PixelBotix Home"
      >
        <img
          src="https://pixelbotix.com/assets/images/logo/logo.png"
          alt="PixelBotix"
        />
      </a>


      <!-- Navigation -->

      <nav
        class="nav-right"
        aria-label="Eduverse navigation"
      >

        <a
          href="https://pixelbotix.com/"
          class="nav-link"
        >
          PixelBotix
        </a>

        <a
          href="https://eduverse.pixelbotix.com/"
          class="nav-link active"
          aria-current="page"
        >
          Eduverse
        </a>


        <!-- Theme Toggle -->

        <button
          type="button"
          class="theme-toggle"
          id="themeToggle"
          aria-label="Toggle dark and light mode"
          title="Toggle theme"
        >

          <!-- Moon Icon -->

          <svg
            class="moon-icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path
              d="M21 12.79A9 9 0 1 1 11.21 3
                 7 7 0 0 0 21 12.79z"
            />
          </svg>


          <!-- Sun Icon -->

          <svg
            class="sun-icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <circle cx="12" cy="12" r="4"/>

            <path d="M12 2v2"/>
            <path d="M12 20v2"/>

            <path d="M4.93 4.93l1.41 1.41"/>
            <path d="M17.66 17.66l1.41 1.41"/>

            <path d="M2 12h2"/>
            <path d="M20 12h2"/>

            <path d="M4.93 19.07l1.41-1.41"/>
            <path d="M17.66 6.34l1.41-1.41"/>
          </svg>

        </button>

      </nav>

    </div>

  </header>


  <!-- ========================================================
       EXISTING PRACTICAL SIMULATOR
       IFRAME SOURCE UNCHANGED
  ========================================================= -->

  <main class="simulator-container">

    <iframe
      src="https://inpatpro.com/practical_demo"
      title="Practical Simulation Lab"
      allow="clipboard-read; clipboard-write"
      allowfullscreen>
    </iframe>

  </main>


  <!-- ========================================================
       PIXELBOTIX EDUVERSE FOOTER
  ========================================================= -->

  <footer class="footer">

    <div class="footer-container">

      <div class="footer-main">

        <div class="footer-brand">

          <a
            href="https://pixelbotix.com/"
            aria-label="PixelBotix Home"
          >
            <img
              src="https://pixelbotix.com/assets/images/logo/logo.png"
              alt="PixelBotix"
              class="footer-logo"
            />
          </a>

          <p class="footer-description">
            PixelBotix Eduverse
            <br />
            Industry-focused learning and certification.
          </p>

        </div>


        <nav
          class="footer-links"
          aria-label="Footer navigation"
        >

          <a
            href="https://pixelbotix.com/"
            class="footer-link"
          >
            PixelBotix
          </a>

          <a
            href="https://eduverse.pixelbotix.com/"
            class="footer-link"
          >
            Eduverse
          </a>

        </nav>

      </div>


      <div class="footer-bottom">

        <div class="copyright">

          &copy;
          <span id="year"></span>
          PixelBotix Technologies Pvt. Ltd.

        </div>

        <div class="eduverse-label">
          PixelBotix Eduverse
        </div>

      </div>

    </div>

  </footer>


  <!-- ========================================================
       JAVASCRIPT
  ========================================================= -->

  <script>

    /* ========================================================
       CURRENT YEAR
    ========================================================= */

    document.getElementById("year").textContent =
      new Date().getFullYear();


    /* ========================================================
       DARK / LIGHT MODE
       Shared PixelBotix Eduverse preference
    ========================================================= */

    const themeToggle =
      document.getElementById("themeToggle");

    const savedTheme =
      localStorage.getItem("pixelbotix-theme");


    /*
     * Theme priority:
     *
     * 1. Saved PixelBotix preference
     * 2. Browser / OS preference
     * 3. Light mode
     */

    if (savedTheme === "dark") {

      document.documentElement.classList.add("dark");

    } else if (savedTheme === "light") {

      document.documentElement.classList.remove("dark");

    } else if (
      window.matchMedia &&
      window.matchMedia("(prefers-color-scheme: dark)").matches
    ) {

      document.documentElement.classList.add("dark");

    }


    /* ========================================================
       TOGGLE
    ========================================================= */

    themeToggle.addEventListener("click", function () {

      document.documentElement.classList.toggle("dark");

      const isDark =
        document.documentElement.classList.contains("dark");

      localStorage.setItem(
        "pixelbotix-theme",
        isDark ? "dark" : "light"
      );

    });

  </script>

</body>
</html>
