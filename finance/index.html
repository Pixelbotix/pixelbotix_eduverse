<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>PixelBotix Eduverse | Finance Portal</title>

  <style>
    :root {
      --bg: #0f172a;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #38bdf8;
      --footer-bg: #0b1220;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
    }

    body {
      display: flex;
      flex-direction: column;
    }

    /* =========================
       HEADER
    ========================= */

    .navbar {
      width: 100%;
      height: 72px;
      flex-shrink: 0;

      background: rgba(15, 23, 42, 0.96);
      border-bottom: 1px solid rgba(51, 65, 85, 0.75);

      display: flex;
      align-items: center;

      position: relative;
      z-index: 10;

      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .nav-container {
      width: 100%;
      max-width: 1180px;
      margin: 0 auto;
      padding: 0 24px;

      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      display: flex;
      align-items: center;
      text-decoration: none;
      flex-shrink: 0;
    }

    .logo img {
      height: 48px;
      width: auto;
      display: block;
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 28px;
    }

    .nav-link {
      color: var(--muted);
      text-decoration: none;

      font-size: 0.95rem;
      font-weight: 500;

      transition: color 0.2s ease;
    }

    .nav-link:hover {
      color: var(--text);
    }

    .nav-link.active {
      color: var(--primary);
    }


    /* =========================
       IFRAME AREA
    ========================= */

    .portal-wrapper {
      width: 100%;
      flex: 1;

      min-height: calc(100vh - 72px - 120px);

      background: #ffffff;
    }

    iframe {
      display: block;

      width: 100%;
      height: 100%;

      min-height: calc(100vh - 72px - 120px);

      border: none;
    }


    /* =========================
       FOOTER
    ========================= */

    .footer {
      width: 100%;
      flex-shrink: 0;

      background: var(--footer-bg);
      border-top: 1px solid rgba(51, 65, 85, 0.7);
    }

    .footer-container {
      max-width: 1180px;
      margin: 0 auto;

      padding: 30px 24px 18px;
    }

    .footer-main {
      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 30px;
    }

    .footer-brand {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .footer-logo {
      height: 40px;
      width: auto;
      display: block;
    }

    .footer-description {
      color: var(--muted);
      font-size: 0.82rem;
      line-height: 1.5;
    }

    .footer-links {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .footer-link {
      color: var(--muted);
      text-decoration: none;

      font-size: 0.86rem;

      transition: color 0.2s ease;
    }

    .footer-link:hover {
      color: var(--primary);
    }

    .footer-bottom {
      margin-top: 22px;
      padding-top: 15px;

      border-top: 1px solid rgba(51, 65, 85, 0.55);

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 20px;
    }

    .copyright,
    .eduverse-label {
      color: #64748b;
      font-size: 0.76rem;
    }


    /* =========================
       TABLET
    ========================= */

    @media (max-width: 800px) {

      .navbar {
        height: 66px;
      }

      .nav-container {
        padding: 0 18px;
      }

      .logo img {
        height: 44px;
      }

      .nav-right {
        gap: 18px;
      }

      .portal-wrapper {
        min-height: calc(100vh - 66px - 170px);
      }

      iframe {
        min-height: calc(100vh - 66px - 170px);
      }

      .footer-main {
        align-items: flex-start;
        flex-direction: column;
        gap: 20px;
      }
    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 520px) {

      .navbar {
        height: 62px;
      }

      .nav-container {
        padding: 0 16px;
      }

      .logo img {
        height: 40px;
      }

      .nav-right {
        gap: 15px;
      }

      .nav-link {
        font-size: 0.84rem;
      }

      .portal-wrapper {
        min-height: calc(100vh - 62px - 190px);
      }

      iframe {
        min-height: calc(100vh - 62px - 190px);
      }

      .footer-container {
        padding: 26px 18px 17px;
      }

      .footer-logo {
        height: 37px;
      }

      .footer-description {
        font-size: 0.78rem;
      }

      .footer-links {
        gap: 18px;
      }

      .footer-link {
        font-size: 0.8rem;
      }

      .footer-bottom {
        margin-top: 20px;
        padding-top: 14px;

        flex-direction: column;
        align-items: flex-start;

        gap: 6px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       PIXELBOTIX EDUVERSE HEADER
  ========================== -->

  <header class="navbar">

    <div class="nav-container">

      <a
        href="https://pixelbotix.com/"
        class="logo"
        aria-label="PixelBotix Home"
      >
        <img
          src="https://pixelbotix.com/assets/images/logo/logo.png"
          alt="PixelBotix"
        />
      </a>

      <nav
        class="nav-right"
        aria-label="Eduverse navigation"
      >

        <a
          href="https://pixelbotix.com/"
          class="nav-link"
        >
          PixelBotix
        </a>

        <a
          href="https://eduverse.pixelbotix.com/"
          class="nav-link active"
          aria-current="page"
        >
          Eduverse
        </a>

      </nav>

    </div>

  </header>


  <!-- =========================
       EXISTING FINANCE PORTAL
       IFRAME UNCHANGED
  ========================== -->

  <main class="portal-wrapper">

    <iframe
      src="https://inpatpro.com/student/signup.html?branch=PBTKRL"
      title="PixelBotix Finance Course Portal"
      referrerpolicy="unsafe-url"
      allow="fullscreen; geolocation;">
    </iframe>

  </main>


  <!-- =========================
       PIXELBOTIX EDUVERSE FOOTER
  ========================== -->

  <footer class="footer">

    <div class="footer-container">

      <div class="footer-main">

        <div class="footer-brand">

          <a
            href="https://pixelbotix.com/"
            aria-label="PixelBotix Home"
          >
            <img
              src="https://pixelbotix.com/assets/images/logo/logo.png"
              alt="PixelBotix"
              class="footer-logo"
            />
          </a>

          <p class="footer-description">
            PixelBotix Eduverse
            <br />
            Industry-focused learning and certification.
          </p>

        </div>


        <nav
          class="footer-links"
          aria-label="Footer navigation"
        >

          <a
            href="https://pixelbotix.com/"
            class="footer-link"
          >
            PixelBotix
          </a>

          <a
            href="https://eduverse.pixelbotix.com/"
            class="footer-link"
          >
            Eduverse
          </a>

        </nav>

      </div>


      <div class="footer-bottom">

        <div class="copyright">
          &copy; <span id="year"></span>
          PixelBotix Technologies Pvt. Ltd.
        </div>

        <div class="eduverse-label">
          PixelBotix Eduverse
        </div>

      </div>

    </div>

  </footer>


  <script>
    document.getElementById("year").textContent =
      new Date().getFullYear();
  </script>

</body>
</html>
