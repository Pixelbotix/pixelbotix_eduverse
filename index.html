<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PixelBotix Eduverse | Learning Verticals</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .header {
      text-align: center;
      margin-bottom: 40px;
    }
    .header h1 {
      font-size: 2.2rem;
      margin-bottom: 8px;
      color: #38bdf8;
    }
    .header p {
      color: #94a3b8;
      font-size: 1rem;
    }
    .container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 24px;
      max-width: 800px;
      width: 100%;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 32px 24px;
      text-align: center;
      transition: all 0.3s ease;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .card.active:hover {
      border-color: #38bdf8;
      transform: translateY(-4px);
      box-shadow: 0 10px 25px -3px rgba(56, 189, 248, 0.2);
    }
    .card.disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .icon {
      font-size: 2.5rem;
      margin-bottom: 16px;
    }
    .title {
      font-size: 1.4rem;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .desc {
      font-size: 0.9rem;
      color: #94a3b8;
      margin-bottom: 20px;
    }
    .btn {
      padding: 10px 20px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.9rem;
      border: none;
    }
    .btn-active {
      background: #0284c7;
      color: #ffffff;
    }
    .btn-disabled {
      background: #475569;
      color: #cbd5e1;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>PixelBotix Eduverse</h1>
    <p>Select your learning portal to continue</p>
  </div>

  <div class="container">
    <a href="/finance/" class="card active">
      <div>
        <div class="icon">📊</div>
        <div class="title">Finance & Cloud Accounting</div>
        <div class="desc">Official Zoho Books & Live GST Certification Portal.</div>
      </div>
      <button class="btn btn-active">Enter Portal &rarr;</button>
    </a>

    <div class="card disabled">
      <div>
        <div class="icon">🤖</div>
        <div class="title">Robotics & Engineering</div>
        <div class="desc">ROS2, AMRs, Bionics & 3D Scanning Masterclasses.</div>
      </div>
      <button class="btn btn-disabled" disabled>Coming Soon</button>
    </div>
  </div>

</body>
</html>
